name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '00 23 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: SkopeoCopy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version

      - name: Copy images to Aliyun with skopeo
        run: |
          set -euo pipefail
          skopeo login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

          declare -A duplicate_images
          declare -A temp_map
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ -z "${line// }" ]] && continue
            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_clean="${image%%@*}"
            image_name_tag=$(echo "$image_clean" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image_clean" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space_key="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space_key" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space_key"
            fi
          done < images.txt

          failed_images=()

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ -z "${line// }" ]] && continue
            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_clean="${image%%@*}"

            # 如果包含 @sha256:，去掉 tag 只保留 "仓库路径/镜像名@sha256:摘要"
            if [[ "$image" == *@* ]]; then
              digest_part="${image#*@}"
              last_segment="${image_clean##*/}"
              prefix_path="${image_clean%/*}"
              repo_only="${last_segment%%:*}"
              if [[ "$prefix_path" == "$image_clean" ]]; then
                src_image="${repo_only}@${digest_part}"
              else
                src_image="${prefix_path}/${repo_only}@${digest_part}"
              fi
            else
              src_image="$image_clean"
            fi

            image_name_tag=$(echo "$image_clean" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image_clean" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
              if [[ -n "${name_space}" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            extra_args=()
            if [[ -n "$platform" && "$platform" == */* ]]; then
              os_part="${platform%%/*}"
              arch_part="${platform#*/}"
              extra_args+=(--override-os "$os_part" --override-arch "$arch_part")
            fi

            echo "=========================================="
            echo "Copying: docker://$src_image -> docker://$new_image"
            if skopeo copy \
              --retry-times 3 \
              "${extra_args[@]}" \
              --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
              "docker://$src_image" \
              "docker://$new_image"; then
              echo "SUCCESS: $new_image"
            else
              echo "FAILED: $line"
              failed_images+=("$line")
            fi
          done < images.txt

          if [ "${#failed_images[@]}" -gt 0 ]; then
            echo "=========================================="
            echo "以下镜像转存失败："
            printf ' - %s\n' "${failed_images[@]}"
            exit 1
          fi
